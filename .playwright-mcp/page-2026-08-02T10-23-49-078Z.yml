          - paragraph [ref=f14e14]: Season 1 · Byte 1 · 5 min
          - heading "Precision and recall" [level=1] [ref=f14e15]
          - paragraph [ref=f14e16]: Why accuracy is the wrong number for almost every interview problem
        - generic [ref=f14e17]:
          - generic [ref=f14e18]:
            - paragraph [ref=f14e19]: Imagine a fraud detector that always predicts "not fraud". On a day when 1 in 1,000 transactions is fraudulent, that model is 99.9% accurate. It is also completely useless.
            - paragraph [ref=f14e20]: Accuracy collapses under class imbalance because the majority class dominates the score. Precision and recall ask more useful questions.
          - generic [ref=f14e21]:
            - heading "Two different questions" [level=2] [ref=f14e22]
            - paragraph [ref=f14e23]:
              - strong [ref=f14e24]: Precision
              - text: "asks: of the cases I flagged, how many were actually positive? High precision means few false alarms."
            - paragraph [ref=f14e25]:
              - strong [ref=f14e26]: Recall
              - text: "asks: of the cases that really were positive, how many did I catch? High recall means few misses."
            - paragraph [ref=f14e27]: You almost never get both for free. Raising the decision threshold raises precision and lowers recall; lowering it does the opposite. The right trade-off depends on the cost of a false alarm versus a miss.
          - generic [ref=f14e28]:
            - heading "The formulas" [level=2] [ref=f14e29]
            - paragraph [ref=f14e30]: "From a confusion matrix with true positives (TP), false positives (FP) and false negatives (FN):"
            - code [ref=f14e32]: precision = TP / (TP + FP) recall = TP / (TP + FN) F1 = 2 · P · R / (P + R)
          - generic [ref=f14e33]:
            - heading "What interviewers want to hear" [level=2] [ref=f14e34]
            - paragraph [ref=f14e35]: Name the cost asymmetry out loud. Fraud and disease screening usually care more about recall — missing a positive is expensive. Spam filters usually care more about precision — a false positive deletes a real email.
            - paragraph [ref=f14e36]: If someone asks "what's a good accuracy?", the right answer is "for this class balance and cost structure, accuracy is the wrong metric". That sentence alone is worth the hire.
